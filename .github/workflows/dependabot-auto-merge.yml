name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest

    # Only run for Dependabot PRs
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge for security updates
        # Auto-merge CRITICAL and HIGH severity security updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          (steps.metadata.outputs.alert-state == 'CRITICAL' ||
           steps.metadata.outputs.alert-state == 'HIGH')
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.metadata.outputs.alert-state != ''
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Dependabot Security Update**

              - **Severity**: ${{ steps.metadata.outputs.alert-state }}
              - **Update Type**: ${{ steps.metadata.outputs.update-type }}
              - **Dependency**: ${{ steps.metadata.outputs.dependency-names }}

              ${steps.metadata.outputs.alert-state === 'CRITICAL' || steps.metadata.outputs.alert-state === 'HIGH'
                ? '✅ This PR will be auto-merged after CI passes.'
                : '⚠️ Manual review required for this update.'}
              `
            })

      - name: Enable auto-merge for minor/patch updates
        # Auto-approve patch and minor version updates (not major)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
