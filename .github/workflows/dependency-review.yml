name: Dependency Review

on:
  pull_request:
    branches: [v2/master, main, master, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Severity threshold, allowed licences and scopes live in the
          # config file. (The action refuses allow-licenses together with
          # deny-licenses, which this workflow used to set.)
          config-file: './.github/dependency-review-config.yml'
          comment-summary-in-pr: on-failure
