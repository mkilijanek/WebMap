# Dependency Review configuration
# https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/configuring-dependency-review

# Fail the check when a pull request adds a dependency with a known
# vulnerability of this severity or higher (low, moderate, high, critical).
fail-on-severity: moderate

# Scopes the severity check applies to.
fail-on-scopes:
  - runtime
  - development

# Licences a new dependency may use. allow-licenses and deny-licenses are
# mutually exclusive; an allow-list is the stricter of the two.
# Current runtime dependencies: Django (BSD-3-Clause), requests
# (Apache-2.0), xmltodict (MIT) and their transitive dependencies
# (asgiref BSD-3-Clause, sqlparse BSD-3-Clause, certifi MPL-2.0,
# charset-normalizer MIT, idna BSD-3-Clause, urllib3 MIT).
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0
  - PSF-2.0
  - Python-2.0
