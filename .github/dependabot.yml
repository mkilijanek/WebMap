# GitHub Dependabot Configuration
# Automatically checks for dependency updates and security vulnerabilities
# https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10

    # Labels for dependency PRs
    labels:
      - "dependencies"
      - "security"
      - "automated"

    # Commit message prefix
    commit-message:
      prefix: "⬆️ deps"
      prefix-development: "⬆️ deps-dev"
      include: "scope"

    # Version update strategy
    versioning-strategy: increase

    # Allow both direct and indirect dependencies
    allow:
      - dependency-type: "all"

  # Docker base image (docker/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "🐳 docker"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "⚙️ ci"

# Review requests come from .github/CODEOWNERS (the 'reviewers' key is
# deprecated). Patch updates are auto-merged once required checks pass, see
# .github/workflows/dependabot-auto-merge.yml.
