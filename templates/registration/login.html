{% load static %}
<!DOCTYPE html>
  <html>
    <head>
      <link rel="stylesheet" href="{% static "vendor/materialize-1.0.0.min.css" %}">
      <link rel="stylesheet" href="{% static "custom.css" %}">
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>WebMap - Login</title>
    </head>

    <body>
		<div class="container" style="margin-top:80px;max-width:420px;">
			<div style="text-align:center;margin-bottom:30px;"><img src="{% static "logo.png" %}" style="height:40px;" /></div>
			<div class="card" style="background-color:#3e3e3e;">
				<div class="card-content">
					<span class="card-title">Sign in</span>
					{% if form.errors %}
					<p class="red-text">Wrong username or password.</p>
					{% endif %}
					<form method="post" action="{% url 'login' %}">
						{% csrf_token %}
						<div class="input-field">
							<input id="id_username" name="username" type="text" autocomplete="username" autofocus required class="white-text">
							<label for="id_username" class="active">Username</label>
						</div>
						<div class="input-field">
							<input id="id_password" name="password" type="password" autocomplete="current-password" required class="white-text">
							<label for="id_password" class="active">Password</label>
						</div>
						<input type="hidden" name="next" value="{{ next }}">
						<button type="submit" class="btn blue">Login</button>
					</form>
				</div>
			</div>
		</div>
    </body>
  </html>
